<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
@import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --dirt:    #866043;
  --grass:   #5d9e3f;
  --stone:   #7f7f7f;
  --stone2:  #999;
  --dark:    #1a1a1a;
  --cream:   #f5f5e8;
  --gold:    #ffcc00;
  --sky1:    #4a90d9;
  --sky2:    #7ab8f5;
}

html, body {
  min-height: 100vh;
  font-family: 'VT323', monospace;
  image-rendering: pixelated;
}

/* =============================================
   SKY + CLOUDS BACKGROUND
   ============================================= */
body {
  background-color: var(--sky1);
  background-image:
    /* Pixel cloud 1 */
    linear-gradient(var(--cream) 0%, var(--cream) 100%),
    linear-gradient(var(--cream) 0%, var(--cream) 100%),
    linear-gradient(var(--cream) 0%, var(--cream) 100%),
    /* Pixel cloud 2 */
    linear-gradient(var(--cream) 0%, var(--cream) 100%),
    linear-gradient(var(--cream) 0%, var(--cream) 100%),
    /* Sky gradient */
    linear-gradient(to bottom, #87ceeb 0%, #4a90d9 100%);
  background-size:
    96px 32px, 128px 16px, 64px 16px,
    80px 32px, 112px 16px,
    100% 100%;
  background-position:
    80px 60px, 64px 76px, 96px 76px,
    420px 110px, 404px 126px,
    0 0;
  background-repeat: no-repeat, no-repeat, no-repeat, no-repeat, no-repeat, no-repeat;
  position: relative;
  overflow-x: hidden;
}

/* Pixel grid overlay (block texture) */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  background-image:
    linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px);
  background-size: 16px 16px;
  pointer-events: none;
}

/* =============================================
   GROUND STRIPE AT BOTTOM
   ============================================= */
.ground {
  position: fixed; bottom: 0; left: 0; right: 0;
  z-index: 1;
  display: flex; flex-direction: column;
}
.grass-strip {
  height: 16px;
  background:
    repeating-linear-gradient(90deg,
      #5d9e3f 0px, #5d9e3f 14px,
      #4a8a2e 14px, #4a8a2e 16px
    );
  border-top: 2px solid #3a7020;
  image-rendering: pixelated;
}
.dirt-strip {
  height: 32px;
  background:
    repeating-linear-gradient(90deg,
      #866043 0px, #866043 15px,
      #7a5538 15px, #7a5538 16px
    ),
    repeating-linear-gradient(0deg,
      rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 1px,
      transparent 1px, transparent 16px
    );
  image-rendering: pixelated;
}

/* =============================================
   MAIN CARD — stone block style
   ============================================= */
.page {
  position: relative; z-index: 2;
  min-height: 100vh;
  padding: 40px 24px 100px;
  display: flex; justify-content: center; align-items: center;
}

.card {
  width: 100%; max-width: 520px;
  position: relative;
}

/* Stone block card with pixelated border */
.card-inner {
  background: #8b8b8b;
  border: 4px solid #000;
  outline: 2px solid rgba(255,255,255,0.12);
  box-shadow:
    inset 2px 2px 0 rgba(255,255,255,0.25),
    inset -2px -2px 0 rgba(0,0,0,0.35),
    4px 4px 0 rgba(0,0,0,0.5);
  padding: 0;
  image-rendering: pixelated;
}

/* Stone texture inside */
.card-body {
  background:
    repeating-linear-gradient(
      0deg,
      transparent, transparent 15px,
      rgba(0,0,0,0.06) 15px, rgba(0,0,0,0.06) 16px
    ),
    repeating-linear-gradient(
      90deg,
      transparent, transparent 15px,
      rgba(0,0,0,0.06) 15px, rgba(0,0,0,0.06) 16px
    ),
    #8b8b8b;
  padding: 40px 40px 36px;
}

/* =============================================
   HEADER BLOCK — grass top
   ============================================= */
.card-header {
  background:
    repeating-linear-gradient(90deg,
      #5d9e3f 0px, #5d9e3f 15px,
      #4a8a2e 15px, #4a8a2e 16px
    );
  border-bottom: 4px solid #3a7020;
  padding: 14px 24px 10px;
  text-align: center;
  position: relative;
}
.card-header::after {
  content: '';
  position: absolute; bottom: -8px; left: 0; right: 0; height: 4px;
  background: repeating-linear-gradient(90deg,
    #866043 0px, #866043 15px,
    #7a5538 15px, #7a5538 16px
  );
}

.header-label {
  font-size: 13px; letter-spacing: 0.12em;
  color: rgba(255,255,255,0.7);
  text-shadow: 1px 1px 0 rgba(0,0,0,0.6);
  text-transform: uppercase;
}

/* =============================================
   TITLE AREA
   ============================================= */
.title-block {
  text-align: center;
  padding: 36px 0 28px;
  border-bottom: 3px solid rgba(0,0,0,0.2);
  margin-bottom: 28px;
  position: relative;
}
.title-block::after {
  content: '';
  position: absolute; bottom: -3px; left: 0; right: 0; height: 1px;
  background: rgba(255,255,255,0.15);
}

.pixel-label {
  font-size: 14px;
  color: rgba(255,255,255,0.55);
  text-shadow: 1px 1px 0 rgba(0,0,0,0.5);
  letter-spacing: 0.1em; text-transform: uppercase;
  margin-bottom: 10px;
}

.main-title {
  font-size: clamp(40px, 8vw, 72px);
  line-height: 0.95;
  color: var(--gold);
  text-shadow:
    2px 2px 0 #a07800,
    4px 4px 0 rgba(0,0,0,0.4);
  letter-spacing: 0.02em;
  margin-bottom: 6px;
}

.date-title {
  font-size: clamp(28px, 5vw, 44px);
  color: #fff;
  text-shadow: 2px 2px 0 rgba(0,0,0,0.5);
  letter-spacing: 0.04em;
}

/* =============================================
   SECTION LABEL
   ============================================= */
.section-label {
  font-size: 18px; letter-spacing: 0.12em; text-transform: uppercase;
  color: rgba(255,255,255,0.6);
  text-shadow: 1px 1px 0 rgba(0,0,0,0.5);
  margin-bottom: 16px;
  display: flex; align-items: center; gap: 10px;
}
.section-label::before, .section-label::after {
  content: ''; flex: 1; height: 2px;
  background: rgba(0,0,0,0.2);
  box-shadow: 0 1px 0 rgba(255,255,255,0.1);
}

/* =============================================
   AGENDA — inventory slot style
   ============================================= */
.agenda { display: flex; flex-direction: column; gap: 6px; }

.agenda-item {
  display: grid; grid-template-columns: 64px 1fr;
  gap: 0;
  background: #6a6a6a;
  border: 3px solid #000;
  box-shadow:
    inset 2px 2px 0 rgba(255,255,255,0.2),
    inset -2px -2px 0 rgba(0,0,0,0.3);
  image-rendering: pixelated;
  position: relative;
  overflow: hidden;
}

/* Item icon slot */
.item-icon {
  display: flex; align-items: center; justify-content: center;
  font-size: 28px;
  background: #555;
  border-right: 3px solid #000;
  box-shadow: inset 2px 2px 0 rgba(255,255,255,0.15), inset -2px -2px 0 rgba(0,0,0,0.3);
  min-height: 64px;
  position: relative;
}
/* Colour tint per slot */
.agenda-item:nth-child(1) .item-icon { background: #5a4a2a; }
.agenda-item:nth-child(2) .item-icon { background: #2a3a4a; }
.agenda-item:nth-child(3) .item-icon { background: #3a2a4a; }

.item-content {
  padding: 10px 14px;
  display: flex; flex-direction: column; justify-content: center;
}

.item-time {
  font-size: 14px; color: rgba(255,255,255,0.5);
  letter-spacing: 0.08em; margin-bottom: 1px;
  text-shadow: 1px 1px 0 rgba(0,0,0,0.6);
}

.item-name {
  font-size: 26px; color: #fff;
  text-shadow: 2px 2px 0 rgba(0,0,0,0.5);
  line-height: 1;
  letter-spacing: 0.02em;
}

.item-sub {
  font-size: 14px; color: #aad4ff;
  text-shadow: 1px 1px 0 rgba(0,0,0,0.6);
  letter-spacing: 0.06em; margin-top: 1px;
}

/* =============================================
   FOOTER
   ============================================= */
.card-footer {
  margin-top: 28px;
  text-align: center;
}

.footer-text {
  font-size: 16px; color: rgba(255,255,255,0.4);
  text-shadow: 1px 1px 0 rgba(0,0,0,0.5);
  letter-spacing: 0.12em; text-transform: uppercase;
}

/* Blinking cursor */
.cursor {
  display: inline-block;
  animation: blink 1s step-end infinite;
  color: var(--gold);
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* =============================================
   PIXELATED CREEPER / TREE DECORATIONS
   ============================================= */
.deco {
  position: fixed; bottom: 48px; z-index: 3;
  image-rendering: pixelated;
  font-size: 40px;
  filter: drop-shadow(2px 2px 0 rgba(0,0,0,0.5));
  user-select: none;
}
.deco-l { left: 24px; }
.deco-r { right: 24px; }

@media (max-width: 600px) {
  .card-body { padding: 32px 20px 28px; }
  .deco { display: none; }
}






/* =============================================
   SUN — pixel art, top-right
   ============================================= */
.mc-sun {
  position: fixed; top: 90px; right: 60px; z-index: 1;
  width: 10px; height: 10px;
  image-rendering: pixelated;
  animation: sun-pulse 4s ease-in-out infinite;
}
@keyframes sun-pulse {
  0%,100% { filter: brightness(1) drop-shadow(0 0 12px #ffdd44); }
  50%      { filter: brightness(1.15) drop-shadow(0 0 24px #ffee66); }
}
.mc-sun::before {
  content: '';
  position: absolute;
  box-shadow:
    10px 0 0 0 #ffee44,20px 0 0 0 #ffee44,30px 0 0 0 #ffee44,40px 0 0 0 #ffee44,50px 0 0 0 #ffee44,60px 0 0 0 #ffee44,
    10px 10px 0 0 #ffee44,20px 10px 0 0 #ffdd22,30px 10px 0 0 #ffdd22,40px 10px 0 0 #ffdd22,50px 10px 0 0 #ffdd22,60px 10px 0 0 #ffee44,
    10px 20px 0 0 #ffee44,20px 20px 0 0 #ffdd22,30px 20px 0 0 #ffcc00,40px 20px 0 0 #ffcc00,50px 20px 0 0 #ffdd22,60px 20px 0 0 #ffee44,
    10px 30px 0 0 #ffee44,20px 30px 0 0 #ffdd22,30px 30px 0 0 #ffcc00,40px 30px 0 0 #ffcc00,50px 30px 0 0 #ffdd22,60px 30px 0 0 #ffee44,
    10px 40px 0 0 #ffee44,20px 40px 0 0 #ffdd22,30px 40px 0 0 #ffdd22,40px 40px 0 0 #ffdd22,50px 40px 0 0 #ffdd22,60px 40px 0 0 #ffee44,
    10px 50px 0 0 #ffee44,20px 50px 0 0 #ffee44,30px 50px 0 0 #ffee44,40px 50px 0 0 #ffee44,50px 50px 0 0 #ffee44,60px 50px 0 0 #ffee44;
  width: 10px; height: 10px;
}

/* =============================================
   BATS — float across sky
   ============================================= */
.bat {
  position: fixed; z-index: 1;
  font-size: 22px;
  filter: drop-shadow(1px 1px 0 rgba(0,0,0,0.8));
  animation-timing-function: linear;
  animation-iteration-count: infinite;
}
@keyframes bat1 { from{left:-40px;top:130px} to{left:calc(100vw+40px);top:110px} }
@keyframes bat2 { from{right:-40px;top:160px} to{right:calc(100vw+40px);top:180px} }
@keyframes bat3 { from{left:-40px;top:200px} to{left:calc(100vw+40px);top:180px} }
#bat1 { animation: bat1 16s linear infinite; animation-delay: -4s; }
#bat2 { animation: bat2 20s linear infinite; animation-delay: -9s; }
#bat3 { animation: bat3 14s linear infinite; animation-delay: -12s; }

/* =============================================
   XP ORBS — floating particles
   ============================================= */
.xp-orb {
  position: fixed; z-index: 1;
  width: 10px; height: 10px;
  background: #80ff44;
  border-radius: 50%;
  box-shadow: 0 0 6px #80ff44, 0 0 12px #40aa00;
  animation: xp-float linear infinite;
}
@keyframes xp-float {
  0%   { transform: translateY(0) scale(1); opacity: 0; }
  10%  { opacity: 1; }
  90%  { opacity: 0.8; }
  100% { transform: translateY(-80px) scale(0.4); opacity: 0; }
}


/* =============================================
   STATIC CHARACTERS — bottom of page
   ============================================= */
.chars-static {
  position: fixed;
  bottom: 26px;
  left: 0; right: 0;
  z-index: 1;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding: 0 32px;
  pointer-events: none;
}
.char-img {
  height: 160px;
  width: auto;
  image-rendering: pixelated;
  filter: drop-shadow(2px 4px 0 rgba(0,0,0,0.6));
}
.char-img.steve {
  height: 180px;
}


/* =============================================
   MOBILE RESPONSIVE
   ============================================= */

/* Base: card takes full width with safe padding */
.page {
  padding: 20px 12px 120px;
}

.card {
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
}

.card-body {
  padding: 28px 20px 24px;
}

.card-header {
  padding: 12px 16px 8px;
}

/* Agenda slots more compact */
.agenda-item {
  grid-template-columns: 44px 1fr;
  gap: 10px;
}

.item-name {
  font-size: 20px;
}

.item-time {
  font-size: 12px;
}

.item-icon {
  min-height: 52px;
}

/* Characters: smaller on mobile, 2 visible */
.chars-static {
  padding: 0 8px;
}

.char-img {
  height: 100px;
}

.char-img.steve {
  height: 115px;
}

/* Hide middle two chars on very small screens */
@media (max-width: 400px) {
  .chars-static img:nth-child(2),
  .chars-static img:nth-child(3) {
    display: none;
  }
  .char-img { height: 90px; }
  .char-img.steve { height: 105px; }
}

@media (max-width: 360px) {
  .card-body { padding: 20px 14px 18px; }
  .main-title { font-size: 38px; }
  .date-title { font-size: 22px; }
  .item-name { font-size: 18px; }
}

</style>
</head>

<script>
// Spawn XP orbs randomly across viewport (in background layer only)
(function() {
  const layer = document.querySelector('.chars-layer');
  function spawnOrb() {
    const orb = document.createElement('div');
    orb.className = 'xp-orb';
    orb.style.left = Math.random() * 100 + 'vw';
    orb.style.bottom = (50 + Math.random() * 200) + 'px';
    const dur = 2 + Math.random() * 3;
    orb.style.animationDuration = dur + 's';
    orb.style.animationDelay = '-' + (Math.random() * dur) + 's';
    layer.appendChild(orb);
    setTimeout(() => orb.remove(), (dur + 1) * 1000);
  }
  setInterval(spawnOrb, 400);
  for(let i=0;i<8;i++) setTimeout(spawnOrb, i*200);
})();
</script>
